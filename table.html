<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Waktu</th>
            <th>Minggu</th>
            <th>Senin</th>
            <th>Selasa</th>
        </tr>
        <tr>
            <td>04.30</td>
            <td colspan="2">bangun pagi</td>
            <td>Masih tidur</td>
        </tr>
        <tr>
            <td>05.00</td>
            <td rowspan="2">Tidur lagi</td>
            <td>Membantu orangtua</td>
            <td>bangun pagi</td>
        </tr>
        <tr>
            <td>06.00</td>
            <td colspan="2">Persiapan sekolah</td>
        </tr>
    </table>

    <h2>Colspan dan Rowspan</h2>
    <p>Colspan adalah menggabungkan kolom</p>
    <p>Rowspan adalah menggabungkan baris</p>
</body>
</html>
